openapi: 3.0.0
info:
  title: CineTix API
  description: REST API untuk Sistem Pemesanan Tiket Bioskop CineTix
  version: 1.0.0
servers:
  - url: http://localhost/cineflix-api
paths:
  /users:
    get:
      summary: Mendapatkan semua pengguna
      responses:
        '200':
          description: Daftar pengguna
    post:
      summary: Menambah pengguna baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Pengguna berhasil dibuat
  /users/{id}:
    get:
      summary: Mendapatkan pengguna berdasarkan ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Data pengguna
    put:
      summary: Memperbarui pengguna
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Pengguna diperbarui
    delete:
      summary: Menghapus pengguna
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pengguna dihapus
  /films:
    get:
      summary: Mendapatkan semua film
      responses:
        '200':
          description: Daftar film
    post:
      summary: Menambah film baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Film'
      responses:
        '201':
          description: Film berhasil dibuat
  /films/{id}:
    get:
      summary: Mendapatkan film berdasarkan ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Data film
    put:
      summary: Memperbarui film
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Film'
      responses:
        '200':
          description: Film diperbarui
    delete:
      summary: Menghapus film
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Film dihapus
  /schedules:
    get:
      summary: Mendapatkan semua jadwal
      responses:
        '200':
          description: Daftar jadwal
    post:
      summary: Menambah jadwal baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      responses:
        '201':
          description: Jadwal berhasil dibuat
  /schedules/{id}:
    get:
      summary: Mendapatkan jadwal berdasarkan ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Data jadwal
    put:
      summary: Memperbarui jadwal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      responses:
        '200':
          description: Jadwal diperbarui
    delete:
      summary: Menghapus jadwal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Jadwal dihapus
  /bookings:
    get:
      summary: Mendapatkan semua booking
      responses:
        '200':
          description: Daftar booking
    post:
      summary: Menambah booking baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '201':
          description: Booking berhasil dibuat
  /bookings/{id}:
    get:
      summary: Mendapatkan booking berdasarkan ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Data booking
    put:
      summary: Memperbarui booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
      responses:
        '200':
          description: Booking diperbarui
    delete:
      summary: Menghapus booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking dihapus
  /payments:
    get:
      summary: Mendapatkan semua pembayaran
      responses:
        '200':
          description: Daftar pembayaran
    post:
      summary: Menambah pembayaran baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
      responses:
        '201':
          description: Pembayaran berhasil dibuat
  /payments/{id}:
    get:
      summary: Mendapatkan pembayaran berdasarkan ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Data pembayaran
    put:
      summary: Memperbarui pembayaran
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
      responses:
        '200':
          description: Pembayaran diperbarui
    delete:
      summary: Menghapus pembayaran
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pembayaran dihapus
  /statistics:
    get:
      summary: Mendapatkan statistik transaksional
      responses:
        '200':
          description: Data statistik
components:
  schemas:
    User:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        member_tier:
          type: string
          enum: [Silver, Gold, Platinum]
    Film:
      type: object
      properties:
        title:
          type: string
        genre:
          type: string
        duration_min:
          type: integer
        rating:
          type: string
    Schedule:
      type: object
      properties:
        film_id:
          type: integer
        studio:
          type: string
        show_time:
          type: string
          format: date-time
        price:
          type: number
    Booking:
      type: object
      properties:
        user_id:
          type: integer
        schedule_id:
          type: integer
        seat_count:
          type: integer
        total_price:
          type: number
        status:
          type: string
          enum: [Pending, Confirmed, Cancelled]
    Payment:
      type: object
      properties:
        booking_id:
          type: integer
        payment_method:
          type: string
        payment_status:
          type: string
          enum: [Pending, Paid, Failed]